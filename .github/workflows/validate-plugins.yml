name: Validate Plugins

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Plugin Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate marketplace manifest
        run: |
          echo "Validating marketplace manifest..."
          if [ ! -f ".claude-plugin/marketplace.json" ]; then
            echo "Error: marketplace.json not found"
            exit 1
          fi

          if ! jq empty .claude-plugin/marketplace.json 2>/dev/null; then
            echo "Error: marketplace.json is not valid JSON"
            exit 1
          fi

          # Validate required marketplace fields
          if ! jq -e '.name' .claude-plugin/marketplace.json > /dev/null 2>&1; then
            echo "Error: marketplace.json missing 'name' field"
            exit 1
          fi

          if ! jq -e '.plugins | length > 0' .claude-plugin/marketplace.json > /dev/null 2>&1; then
            echo "Error: marketplace.json has no plugins listed"
            exit 1
          fi

          echo "✓ Marketplace manifest is valid"

      - name: Validate all plugins
        run: |
          FAILED=0

          # Read plugin entries from marketplace.json
          PLUGIN_COUNT=$(jq '.plugins | length' .claude-plugin/marketplace.json)
          echo "Found $PLUGIN_COUNT plugin(s) to validate"
          echo ""

          for i in $(seq 0 $(($PLUGIN_COUNT - 1))); do
            PLUGIN_NAME=$(jq -r ".plugins[$i].name" .claude-plugin/marketplace.json)
            PLUGIN_SOURCE=$(jq -r ".plugins[$i].source" .claude-plugin/marketplace.json)

            echo "----------------------------------------"
            echo "Validating plugin: $PLUGIN_NAME ($PLUGIN_SOURCE)"
            echo "----------------------------------------"

            # Check plugin directory exists
            if [ ! -d "$PLUGIN_SOURCE" ]; then
              echo "✗ Plugin directory not found: $PLUGIN_SOURCE"
              FAILED=1
              continue
            fi

            # Check plugin.json exists and is valid JSON
            PLUGIN_JSON="$PLUGIN_SOURCE/.claude-plugin/plugin.json"
            if [ ! -f "$PLUGIN_JSON" ]; then
              echo "✗ Missing plugin manifest: $PLUGIN_JSON"
              FAILED=1
              continue
            fi

            if ! jq empty "$PLUGIN_JSON" 2>/dev/null; then
              echo "✗ Invalid JSON in $PLUGIN_JSON"
              FAILED=1
              continue
            fi

            # Validate required fields in plugin.json
            for field in name version description; do
              if ! jq -e ".$field" "$PLUGIN_JSON" > /dev/null 2>&1; then
                echo "✗ Missing required field '$field' in $PLUGIN_JSON"
                FAILED=1
              fi
            done

            # Validate name matches between marketplace and plugin manifest
            MANIFEST_NAME=$(jq -r '.name' "$PLUGIN_JSON")
            if [ "$MANIFEST_NAME" != "$PLUGIN_NAME" ]; then
              echo "✗ Plugin name mismatch: marketplace says '$PLUGIN_NAME', plugin.json says '$MANIFEST_NAME'"
              FAILED=1
            fi

            # Validate hooks.json if hooks directory exists
            HOOKS_JSON="$PLUGIN_SOURCE/hooks/hooks.json"
            if [ -f "$HOOKS_JSON" ]; then
              if ! jq empty "$HOOKS_JSON" 2>/dev/null; then
                echo "✗ Invalid JSON in $HOOKS_JSON"
                FAILED=1
              else
                echo "  ✓ hooks/hooks.json is valid JSON"
              fi
            fi

            # Validate skills have SKILL.md
            if [ -d "$PLUGIN_SOURCE/skills" ]; then
              for skill_dir in "$PLUGIN_SOURCE"/skills/*/; do
                if [ -d "$skill_dir" ]; then
                  skill_name=$(basename "$skill_dir")
                  if [ ! -f "$skill_dir/SKILL.md" ]; then
                    echo "✗ Skill '$skill_name' missing SKILL.md"
                    FAILED=1
                  else
                    echo "  ✓ skills/$skill_name/SKILL.md exists"
                  fi
                fi
              done
            fi

            # Validate agents have frontmatter
            if [ -d "$PLUGIN_SOURCE/agents" ]; then
              for agent_file in "$PLUGIN_SOURCE"/agents/*.md; do
                if [ -f "$agent_file" ]; then
                  agent_name=$(basename "$agent_file")
                  if ! head -1 "$agent_file" | grep -q '^---'; then
                    echo "✗ Agent '$agent_name' missing YAML frontmatter"
                    FAILED=1
                  else
                    echo "  ✓ agents/$agent_name has frontmatter"
                  fi
                fi
              done
            fi

            if [ $FAILED -eq 0 ]; then
              echo "✓ Plugin '$PLUGIN_NAME' is valid"
            fi
            echo ""
          done

          if [ $FAILED -eq 1 ]; then
            echo "❌ One or more plugins failed validation"
            exit 1
          else
            echo "✅ All plugins validated successfully!"
          fi

      - name: Summary
        if: success()
        run: |
          PLUGIN_COUNT=$(jq '.plugins | length' .claude-plugin/marketplace.json)
          echo "✅ Successfully validated $PLUGIN_COUNT plugin(s) in the marketplace"
